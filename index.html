.cat{flex:0 0 66px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.cat i{display:flex;width:58px;height:58px;margin:0 auto 6px;border-radius:99px;background:var(--card);border:2px solid var(--bd);align-items:center;justify-content:center;font-style:normal;font-size:28px;box-shadow:0 2px 6px #0001}
.cat.on i{border-color:var(--pri)}.cat.on{color:var(--pri);font-weight:600}
.mos{display:flex;flex-direction:column;gap:8px}.mrow{display:flex;gap:8px;height:140px}
.zt{border-radius:10px;position:relative;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:10px 6px}
.zt::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,#0008)}
.zt b,.zt small{position:relative;z-index:1;text-shadow:0 1px 3px #0008}.zt b{font-size:17px}.zt small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.zt:hover{filter:brightness(1.1)}
@media(max-width:600px){.mrow{flex-wrap:wrap;height:auto}.zt{flex:1 1 45%!important;height:100px}}
</style>

const MS={tab:'all',q:'',type:'',deal:'',sort:'new'};
const DAY=864e5,dt=t=>new Date(t).toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});
function ensure(l){if(!l.created)l.created=Date.now()-(l.id%7+1)*3*DAY;if(!l.exp)l.exp=l.created+(10+(l.id*7)%25)*DAY+8*DAY;if(!l.code)l.code='C'+(20000+l.id*37)}
function lstat(l){if(l.deleted)return'deleted';if(l.closed)return'closed';if(l.status==='draft')return'draft';if(l.status==='pending')return'pending';if(l.status==='rejected')return'fix';if(l.exp<Date.now())return'expired';return'online'}
function sbar(act){const u=me();return `<aside><div class="panel" style="text-align:center"><div class="av2 avc" onclick="$('#avf').click()" title="เปลี่ยนรูปโปรไฟล์">${u.avatar?avL(u):esc((u.name||'U')[0])}<span class="cam">📷</span></div><input id="avf" type="file" accept="image/*" hidden onchange="avUp(this)"><b>${esc(u.name)}</b><div class="mut">${esc(u.email)}</div><button class="btn s" style="width:100%;margin-top:10px" onclick="go('profile')">ดูโปรไฟล์</button></div><div class="panel" style="padding:6px">${[['my','📂 MyStock',"go('my')"],['inq','💬 Inquiry',"go('inq')"],...(u.role==='user'?[['chat','🗨 Chat','contactStaff()']]:[]),['notes','📝 My Note',"go('notes')"],['profile','🔑 Change password',"go('profile')"],['out','⎋ Logout','logout()']].map(([k,t,f])=>`<div class="sbi ${act===k?'on':''}" onclick="${f}">${t}</div>`).join('')}</div></aside>`}
function my(){const u=me();if(!u)return go('home');const all=DB.listings.filter(l=>l.owner===u.email&&!l.deleted);const trash=DB.listings.filter(l=>l.owner===u.email&&l.deleted);all.forEach(ensure);save();const now=Date.now();
 const IT={all:()=>true,online:l=>lstat(l)==='online',near:l=>lstat(l)==='online'&&l.exp-now<7*DAY,fix:l=>lstat(l)==='fix',pending:l=>lstat(l)==='pending',susp:()=>false,expired:l=>lstat(l)==='expired',draft:l=>lstat(l)==='draft',closed:l=>lstat(l)==='closed'};
 const TB=[['all','ทั้งหมด'],['online','ออนไลน์'],['near','ใกล้หมดอายุ'],['fix','ที่ต้องแก้ไข'],['pending','รอตรวจสอบ'],['susp','ถูกระงับ'],['expired','หมดอายุ'],['draft','แบบร่าง'],['closed','ปิดการขาย'],['trash','ถูกลบ']];
 const r=(MS.tab==='trash'?trash:all).filter(IT[MS.tab]||(()=>true)).filter(l=>(!MS.q||(l.title+l.code+(l.ptags||[]).join(' ')).includes(MS.q))&&(!MS.type||l.type===MS.type)&&(!MS.deal||l.deal===MS.deal)).sort((a,b)=>MS.sort==='old'?a.created-b.created:(b.bump||b.created)-(a.bump||a.created));
 $('#app').innerHTML=`<div class="mywrap">${sbar('my')}<div><div class="panel" style="padding:0;overflow:hidden"><div class="tbs">${TB.map(([k,n])=>`<div class="tbi ${MS.tab===k?'on':''}" onclick="MS.tab='${k}';my()"><span>${n}</span><b>${k==='trash'?trash.length:all.filter(IT[k]).length}</b></div>`).join('')}</div>
 <div style="padding:12px"><div class="lbar"><input class="srch" placeholder="ค้นหาประกาศ" value="${esc(MS.q)}" onchange="MS.q=this.value;my()"><select style="width:auto" onchange="MS.type=this.value;my()"><option value="">ประเภทอสังหาฯ</option>${TYPES.map(t=>`<option value="${t}" ${MS.type===t?'selected':''}>${t}</option>`).join('')}</select><select style="width:auto" onchange="MS.deal=this.value;my()"><option value="">ประเภทประกาศ</option><option value="rent" ${MS.deal==='rent'?'selected':''}>ให้เช่า</option><option value="sale" ${MS.deal==='sale'?'selected':''}>ขาย</option></select><button class="chip" onclick="MS.sort=MS.sort==='old'?'new':'old';my()">↕</button><button class="btn s" onclick="my()">ค้นหา</button></div>
 <div class="lbar" style="margin:0"><button class="chip" onclick="bulk('bump')">🚀 ดันหลายรายการ</button><button class="chip" onclick="bulk('ext')">⏱ เพิ่มอายุหลายรายการ</button>${canPostNow(u)?'<button class="chip g" onclick="DB.editing=null;go(\'post\')">+ ลงประกาศใหม่</button>':''}</div></div></div>
 ${r.map(myrow).join('')||'<div class="empty">ยังไม่มีประกาศ</div>'}</div></div>`}
function myrow(l){if(l.deleted)return delRow(l);const d=Math.ceil((l.exp-Date.now())/DAY),fv=DB.users.filter(x=>x.fav.includes(l.id)).length,st=lstat(l),sb={pending:['pending','รออนุมัติ'],fix:['rejected','ไม่ผ่าน'],expired:['rejected','หมดอายุ'],closed:['pending','ปิดการขาย'],draft:['pending','แบบร่าง']}[st];
 return `<div class="panel mr"><div class="mri" style="${bg(l)}"><span class="eb ${d<=7?'bad':''}">วันหมดอายุ : ${dt(l.exp)} (${d} วัน)</span>${pic(l)?'':(ICON[l.type]||'🏠')}</div><div class="mrb"><div style="display:flex;justify-content:space-between;gap:8px"><div class="tg"><span>${l.type}</span><span class="d">${dlab(l)}</span>${sb?`<span class="st ${sb[0]}">${sb[1]}</span>`:''}</div><span class="mut"><span class="sp" style="margin:0">${icn('eye')} ${l.views}</span> <span class="sp" style="margin:0 0 0 8px">${icn('heart')} ${fv}</span> <button class="abtn nt s2" onclick="pnoteL(${l.id})">${icn('note',15)} โน๊ต${l.pnote?' •':''}</button></span></div><b>${esc(l.title)}</b>${(()=>{const rs=DB.reports.filter(r=>r.l===l.id&&(r.st==='open'||r.st==='reviewing'));return rs.length?`<div style="color:var(--bad);font-size:13px">⚑ ถูกรายงาน ${rs.length} ครั้ง: ${esc([...new Set(rs.map(r=>RPTL[r.cat]))].join(' · '))}</div>`:''})()}${(l.ptags||[]).length?`<div class="tgs">${l.ptags.map(t=>`<span>${icn('tag',12)} ${esc(t)}</span>`).join('')}</div>`:''}${l.rejectReason&&st==='fix'?`<div style="color:var(--bad);font-size:13px">เหตุผลที่ไม่อนุมัติ: ${esc(l.rejectReason)}</div>`:''}<div class="mut mi">${icn('pin')} ${loc(l)}</div><div class="pp">฿${baht(l.price)}${l.deal==='rent'?' /ด.':''}</div><div class="mut">(รหัสทรัพย์ : ${l.code})</div><div class="mut">${l.floor?'ชั้นที่ '+l.floor+' · ':''}${l.bed?l.bed+' นอน · '+l.bath+' น้ำ · ':''}${l.area} ตร.ม.</div><div class="mut">${l.bump?'ดันเมื่อ ':'สร้างเมื่อ '}${dt(l.bump||l.created)}</div><div class="mrbt"><button class="chip" onclick="mng(${l.id})">${icn('gear',15)} จัดการ</button><button class="chip" onclick="ext(${l.id})">เพิ่มอายุ</button><button class="chip g" onclick="bump(${l.id})">ดันประกาศ</button></div></div></div>`}
function editL(id){DB.editing=id;go('post')}
function mng(id){const l=DB.listings.find(x=>x.id===id);if(!l)return;const row=(ic,t,fn,cls,nw)=>`<div class="mgr ${cls||''}" onclick="${fn}">${icn(ic,19)}<span>${t}</span>${nw?'<em class="nw2">New</em>':''}</div>`;
 modal(`<div class="mgh"><h3>จัดการประกาศ</h3><button class="chip" onclick="close_()">✕</button></div><div class="mut" style="margin:-6px 0 10px;font-size:13px">${esc(tt(l))}</div><div class="mgt"><div class="mgb" onclick="statL(${id})">${icn('chart',26)}<span>สถิติ</span></div><div class="mgb" onclick="close_();editL(${id})">${icn('edit',26)}<span>แก้ไข</span></div></div>
<div class="mgl">${row('eye','ดูรายละเอียด',`close_();detail(${id})`)}${row('tag','แท็กส่วนตัว',`tagsL(${id})`,'',1)}${row('note','โน๊ต',`pnoteL(${id})`)}${row('sold',l.closed?'เปิดขายอีกครั้ง':'ปิดการขาย',`clo(${id})`)}${row('share','แชร์ประกาศ',`shareId(${id})`)}${row('trash','ลบประกาศ',`delConfirm(${id})`,'red')}</div>`)}
function statL(id){const l=DB.listings.find(x=>x.id===id);if(!l)return;ensure(l);const fv=DB.users.filter(u=>u.fav.includes(id)).length,leads=(l.leads||[]).length,dl=Math.max(0,Math.ceil((l.exp-Date.now())/DAY)),days=[];
 for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*DAY),k=d.toISOString().slice(0,10);days.push([(l.vlog||{})[k]||0,d.getDate()+'/'+(d.getMonth()+1)])}const mx=Math.max(1,...days.map(x=>x[0]));
 modal(`<div class="mgh"><h3>สถิติประกาศ</h3><button class="chip" onclick="close_()">✕</button></div><div class="mut" style="margin:-6px 0 10px;font-size:13px">${esc(tt(l))}</div>
<div class="stats" style="margin-bottom:12px"><div class="stat"><b>${l.views||0}</b>เข้าชมทั้งหมด</div><div class="stat"><b>${fv}</b>รายการโปรด</div><div class="stat"><b>${leads}</b>ผู้สนใจ</div><div class="stat"><b>${dl}</b>วันคงเหลือ</div></div>
<b>เข้าชม 7 วันล่าสุด</b><div class="bars">${days.map(([v,lab])=>`<div class="bar"><b>${v}</b><i style="height:${Math.round(v/mx*64)+3}px"></i><span>${lab}</span></div>`).join('')}</div>
<div class="mut" style="font-size:12px;margin:8px 0">ระบบเริ่มเก็บยอดเข้าชมรายวันตั้งแต่เวอร์ชันนี้ ยอดก่อนหน้านี้รวมอยู่ในยอดทั้งหมด</div><button class="btn o" style="color:var(--pri)" onclick="mng(${id})">‹ กลับ</button>`)}
function tagsL(id){const l=DB.listings.find(x=>x.id===id);if(!l)return;l.ptags=l.ptags||[];
 modal(`<div class="mgh"><h3>แท็กส่วนตัว</h3><button class="chip" onclick="close_()">✕</button></div><div class="mut" style="font-size:13px;margin-bottom:8px">แท็กนี้เห็นเฉพาะคุณ ใช้จัดกลุ่มประกาศ และค้นหาได้ในหน้า MyStock</div>
<div style="display:flex;gap:8px"><input id="ptn" placeholder="เช่น ลูกค้า VIP, ต้องติดตาม" onkeydown="if(event.key==='Enter')ptAdd(${id})"><button class="btn s" onclick="ptAdd(${id})">เพิ่ม</button></div>
<div class="tgs" style="margin:10px 0">${l.ptags.map((t,i)=>`<span>${icn('tag',12)} ${esc(t)} <a style="cursor:pointer;margin-left:4px" onclick="ptDel(${id},${i})">✕</a></span>`).join('')||'<span class="mut">ยังไม่มีแท็ก</span>'}</div><button class="btn o" style="color:var(--pri)" onclick="mng(${id})">‹ กลับ</button>`)}
function ptAdd(id){const l=DB.listings.find(x=>x.id===id),t=($('#ptn')||{value:''}).value.trim();if(!t)return;if(!l.ptags.includes(t))l.ptags.push(t);save();tagsL(id);my()}
function ptDel(id,i){const l=DB.listings.find(x=>x.id===id);l.ptags.splice(i,1);save();tagsL(id);my()}
function pnoteL(id){const l=DB.listings.find(x=>x.id===id);if(!l)return;modal(`<div class="mgh"><h3>โน๊ต</h3><button class="chip" onclick="close_()">✕</button></div><div class="mut" style="font-size:13px;margin-bottom:8px">โน๊ตนี้เห็นเฉพาะคุณ ไม่แสดงต่อลูกค้า</div><textarea id="pnt" rows="5" placeholder="จดบันทึกเกี่ยวกับประกาศนี้">${esc(l.pnote||'')}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1" onclick="pnoteSave(${id})">บันทึกโน๊ต</button><button class="btn o" style="color:var(--pri)" onclick="close_()">ปิด</button></div>`)}
function pnoteSave(id){const l=DB.listings.find(x=>x.id===id);l.pnote=$('#pnt').value.trim();if(!l.pnote)delete l.pnote;save();close_();toast('บันทึกโน้ตแล้ว');if(view==='my')my()}
const shareUrl=id=>location.href.split('#')[0]+'#l='+id;
function shareId(id){const l=DB.listings.find(x=>x.id===id),url=shareUrl(id);if(navigator.share)navigator.share({title:l.title,url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('คัดลอกลิงก์แล้ว')).catch(()=>toast(url));else toast(url)}
function delConfirm(id){const l=DB.listings.find(x=>x.id===id);modal(`<div class="mgh"><h3>ลบประกาศ</h3><button class="chip" onclick="close_()">✕</button></div><p><b>${esc(tt(l))}</b></p><div class="tip">ประกาศจะถูกซ่อนจากหน้าเว็บและจากรายการของเจ้าของประกาศ แต่ <b>ข้อมูลทั้งหมดยังถูกเก็บไว้</b> (รูป รายละเอียด สถิติ) กู้คืนได้ที่แท็บ "ถูกลบ" ใน MyStock หรือที่หน้าแอดมิน</div><div style="display:flex;gap:8px"><button class="btn r" style="flex:1" onclick="delL(${id})">ลบประกาศ</button><button class="btn o" style="color:var(--pri)" onclick="${view==='my'?`mng(${id})`:'close_()'}">ยกเลิก</button>${isAdm()?`<button class="btn o" style="color:var(--bad)" onclick="purgeL(${id})" title="ลบถาวร กู้คืนไม่ได้">ลบถาวร</button>`:''}</div>`)}
function delL(id){const l=DB.listings.find(x=>x.id===id),u=me();if(!l||!u||!(u.role==='admin'||l.owner===u.email))return toast('เฉพาะแอดมินเท่านั้น');l.deleted=true;l.deletedAt=Date.now();l.deletedBy=DB.me;save();close_();nav();if(view==='admin')admin();else if(view==='my')my();else render();toast('ลบประกาศแล้ว — ข้อมูลยังเก็บไว้ กู้คืนได้')}
function restoreL(id){const l=DB.listings.find(x=>x.id===id),u=me();if(!l||!u||!(u.role==='admin'||l.owner===u.email))return toast('เฉพาะแอดมินเท่านั้น');delete l.deleted;delete l.deletedAt;delete l.deletedBy;save();nav();if(view==='admin')admin();else my();toast('กู้คืนประกาศแล้ว')}
function purgeL(id){if(admOnly())return;askc('ลบถาวร? ข้อมูลประกาศนี้จะหายไปและกู้คืนไม่ได้',()=>{DB.listings=DB.listings.filter(l=>l.id!==id);DB.users.forEach(u=>{u.fav=u.fav.filter(x=>x!==id)});save();nav();admin();toast('ลบถาวรแล้ว')},{ok:'ลบถาวร'})}
function delRow(l){return `<div class="panel mr" style="opacity:.85"><div class="mri" style="${bg(l)};filter:grayscale(.6)">${pic(l)?'':(ICON[l.type]||'🏠')}</div><div class="mrb"><div class="tg"><span>${l.type}</span><span class="d">${dlab(l)}</span><span class="st rejected">ถูกลบ</span></div><b>${esc(l.title)}</b><div class="mut mi">${icn('pin')} ${loc(l)}</div><div class="mut">ลบเมื่อ ${dt(l.deletedAt||Date.now())} · ข้อมูลยังถูกเก็บไว้</div><div class="mrbt"><button class="chip g" onclick="restoreL(${l.id})">${icn('restore',15)} กู้คืน</button></div></div></div>`}
function clo(id){const l=DB.listings.find(x=>x.id===id);l.closed=!l.closed;save();close_();my()}
function ext(id){const l=DB.listings.find(x=>x.id===id);l.exp=Math.max(l.exp,Date.now())+30*DAY;save();my();toast('เพิ่มอายุ 30 วันแล้ว')}
function bump(id){const l=DB.listings.find(x=>x.id===id);if(lstat(l)!=='online')return toast('ดันได้เฉพาะประกาศออนไลน์');l.bump=Date.now();save();my();toast('ดันประกาศแล้ว')}
function bulk(k){const u=me(),a=DB.listings.filter(l=>l.owner===u.email&&lstat(l)==='online');if(!a.length)return toast('ไม่มีประกาศออนไลน์');a.forEach(l=>k==='bump'?l.bump=Date.now():l.exp+=30*DAY);save();my();toast(k==='bump'?'ดันประกาศแล้ว':'เพิ่มอายุ 30 วันแล้ว')}

const nrm=t=>String(t||'').toLowerCase().replace(/[\u0E48-\u0E4C]/g,'').replace(/[\s\-_.,()'"•/&]+/g,'');
function fdist(q,t){const m=q.length;let p2=null,prev=Array.from({length:m+1},(_,i)=>i),best=m;for(let j=0;j<t.length;j++){const cur=[0];for(let i=1;i<=m;i++){let v=Math.min(prev[i]+1,cur[i-1]+1,prev[i-1]+(q[i-1]===t[j]?0:1));if(p2&&i>1&&q[i-1]===t[j-1]&&q[i-2]===t[j])v=Math.min(v,p2[i-2]+1);cur[i]=v}p2=prev;prev=cur;if(prev[m]<best)best=prev[m]}return best}
function subseq(q,t){let i=0;for(const c of t)if(c===q[i])i++;return i===q.length}
function fscore(q,x){const nq=nrm(q);if(!nq)return 1;const nm=nrm(x.n),ne=nrm(x.e),nz=nrm(x.z),pos=[nm.indexOf(nq),ne.indexOf(nq)].filter(i=>i>=0);
 if(pos.length)return 100-Math.min(...pos)*.5+(nm.startsWith(nq)||ne.startsWith(nq)?10:0);
 if(nz.includes(nq))return 70;
 const toks=String(q).trim().split(/\s+/).map(nrm).filter(Boolean),all=nm+'|'+ne+'|'+nz;
 if(toks.length>1&&toks.every(t=>all.includes(t)))return 80;
 const tk=t=>all.includes(t)||(t.length>=3&&Math.min(fdist(t,nm),ne?fdist(t,ne):9)<=(t.length>=7?2:t.length>=4?1:0));
 if(toks.length>1&&toks.every(tk))return 60;
 if(nq.length>=4){const al=nq.length>=7?2:1,d=Math.min(fdist(nq,nm),ne?fdist(nq,ne):9);if(d<=al)return 40-d}
 if(nq.length>=3&&(subseq(nq,nm)||subseq(nq,ne)))return 20;
 return 0}
function fsearch(q,arr){return arr.map((x,i)=>[fscore(q,x),i,x]).filter(a=>a[0]>0||x_none(a[2])&&!nrm(q)).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(a=>a[2])}
const x_none=x=>!!x.none;
function hl(t,q){t=String(t||'');const k=String(q||'').trim().toLowerCase(),i=k?t.toLowerCase().indexOf(k):-1;return i<0?esc(t):esc(t.slice(0,i))+'<span class="hl2">'+esc(t.slice(i,i+k.length))+'</span>'+esc(t.slice(i+k.length))}

function cropTo(f,w,h){return new Promise((ok,no)=>{if(f.size>10*1024*1024)return no('big');const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const sc=Math.max(w/im.width,h/im.height),dw=im.width*sc,dh=im.height*sc;c.getContext('2d').drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);ok(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}

function fitPng(f,n,hh){hh=hh||n;return new Promise((ok,no)=>{if(f.size>10*1024*1024)return no('big');const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const c=document.createElement('canvas');c.width=n;c.height=hh;const sc=Math.min(n/im.width,hh/im.height),w=im.width*sc,h=im.height*sc;c.getContext('2d').drawImage(im,(n-w)/2,(hh-h)/2,w,h);ok(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)})}
function trH(){return `<div class="panel"><b>โลโก้สายรถไฟฟ้า</b><div class="tip" style="margin-top:6px">📐 ขนาดโลโก้แนะนำ <b>200 × 200 พิกเซล</b> (สี่เหลี่ยมจัตุรัส) · ไฟล์ <b>PNG พื้นหลังโปร่งใส</b> จะสวยที่สุด · ระบบย่อให้พอดีกรอบโดยไม่ตัดภาพ<br>⚠ ใช้เฉพาะโลโก้ที่คุณมีสิทธิ์นำมาใช้ ถ้าไม่ใส่โลโก้ จะแสดงไอคอนรถไฟสีของสายนั้นแทน</div></div>${TR.map((t,i)=>`<div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="tr" style="border-color:${t[1]};flex:0 0 96px;cursor:default">${trIcon(t)}${esc(t[0])}</div><div class="f" style="flex:1;min-width:240px"><div><label>ชื่อสาย</label><input value="${esc(t[0])}" onchange="tSet(${i},0,this.value)"></div><div><label>สีกรอบ/ไอคอน</label><input type="color" value="${t[1]}" onchange="tSet(${i},1,this.value)" style="height:42px;padding:2px"></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn s" onclick="$('#tf_${i}').click()">⬆ อัปโหลดโลโก้</button><input id="tf_${i}" type="file" accept="image/*" hidden onchange="tUp(${i},this)">${t[3]?`<button class="btn o s" style="color:var(--bad)" onclick="tSet(${i},3,'');admin()">ลบโลโก้</button>`:''}<button class="btn o s" onclick="tMove(${i},-1)">↑</button><button class="btn o s" onclick="tMove(${i},1)">↓</button><button class="btn r s" onclick="tDel(${i})">ลบสาย</button></div></div>`).join('')}<button class="btn" onclick="cadd('TR');admin()">+ เพิ่มสาย</button>`}
function tSet(i,k,v){if(admOnly())return;TR[i][k]=v;ccommit('TR')}
function tDel(i){if(admOnly())return;askc('ลบสายนี้?',()=>{TR.splice(i,1);ccommit('TR');admin()})}
function tMove(i,d){if(admOnly())return;const j=i+d;if(j<0||j>=TR.length)return;[TR[i],TR[j]]=[TR[j],TR[i]];ccommit('TR');admin()}
async function tUp(i,inp){if(admOnly())return;const f=inp.files[0];if(!f)return;const t=TR[i],old=t[3];try{t[3]=await fitPng(f,200);if(!ccommit('TR')){t[3]=old;return}admin()}catch(e){toast(e==='big'?'ไฟล์ใหญ่เกิน 10 MB':'อ่านรูปไม่ได้ ลองไฟล์ PNG/JPG')}}

const DBSQL="-- =====================================================================\n-- New Vista Int. Properties : Database schema v2  (พร้อมเชื่อม Supabase)\n-- PostgreSQL 15+  ·  Supabase (Auth + Storage + RLS)\n--\n-- วิธีใช้\n--   1) Supabase → SQL Editor → วางทั้งไฟล์ → Run   (รันซ้ำได้ ไม่ทำให้ข้อมูลหาย)\n--   2) สมัครสมาชิกบัญชีแรกในเว็บ/หน้า Auth แล้วตั้งเป็นแอดมินด้วยคำสั่งท้ายไฟล์\n--   3) Project Settings → API → คัดลอก Project URL + anon/publishable key\n--      ไปใส่ที่ แผงแอดมิน → 🗄 ฐานข้อมูล แล้วกด \"ทดสอบการเชื่อมต่อ\"\n--\n-- ความปลอดภัย: ทุกตารางเปิด Row Level Security (RLS) แล้ว\n--   • คนทั่วไป (anon) อ่านได้เฉพาะประกาศที่อนุมัติ + ข้อมูลหน้าเว็บสาธารณะ\n--   • ตารางส่วนตัว (profiles, reports, notifications, inquiries, staff_messages ฯลฯ) anon อ่านไม่ได้\n--   • ห้ามนำ service_role key ไปใส่ในเว็บเด็ดขาด\n-- =====================================================================\n\n\n-- ======================================================================\n-- 0. Extensions / schema\n-- ======================================================================\ncreate schema if not exists extensions;\ncreate extension if not exists pg_trgm with schema extensions;   -- ค้นหาชื่อแบบใกล้เคียง (fuzzy)\n\n-- ======================================================================\n-- 1. ENUM\n-- ======================================================================\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='user_role' and s.nspname='public') then create type public.user_role as enum ('user','staff','admin'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='deal_type' and s.nspname='public') then create type public.deal_type as enum ('rent','sale','sublease','down'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='listing_status' and s.nspname='public') then create type public.listing_status as enum ('draft','pending','approved','rejected'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='poster_role' and s.nspname='public') then create type public.poster_role as enum ('owner','agent'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='image_kind' and s.nspname='public') then create type public.image_kind as enum ('photo','plan'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='report_category' and s.nspname='public') then create type public.report_category as enum ('info','price','sold','dup','photo','scam','spam','other'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='report_status' and s.nspname='public') then create type public.report_status as enum ('open','reviewing','resolved','dismissed'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='news_kind' and s.nspname='public') then create type public.news_kind as enum ('feature','side','review','video'); end if; end $$;\ndo $$ begin if not exists (select 1 from pg_type t join pg_namespace s on s.oid=t.typnamespace where t.typname='message_kind' and s.nspname='public') then create type public.message_kind as enum ('contact','report'); end if; end $$;\n\n-- ======================================================================\n-- 2. ตารางผู้ใช้ (เชื่อมกับ Supabase Auth)\n-- ======================================================================\ncreate table if not exists public.profiles (\n  id            uuid primary key references auth.users(id) on delete cascade,\n  email         text not null,\n  name          text not null default '',\n  role          public.user_role not null default 'user',\n  phone         text,\n  line_id       text,\n  avatar_url    text,\n  auto_approve  boolean not null default false,   -- ลงประกาศแล้วเผยแพร่ทันที ไม่ต้องรออนุมัติ (แอดมินตั้งให้)\n  is_banned     boolean not null default false,\n  created_at    timestamptz not null default now(),\n  updated_at    timestamptz not null default now()\n);\ncreate unique index if not exists profiles_email_uq on public.profiles (lower(email));\n\n-- สร้างโปรไฟล์อัตโนมัติเมื่อมีคนสมัครสมาชิก\ncreate or replace function public.handle_new_user() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  insert into public.profiles (id, email, name)\n  values (new.id, new.email, coalesce(nullif(new.raw_user_meta_data->>'name',''), split_part(new.email,'@',1)))\n  on conflict (id) do nothing;\n  return new;\nend $$;\ndrop trigger if exists on_auth_user_created on auth.users;\ncreate trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();\n\n-- ฟังก์ชันตรวจสิทธิ์ (ใช้ใน RLS)\ncreate or replace function public.is_admin() returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.profiles p where p.id = auth.uid() and p.role = 'admin' and not p.is_banned) $$;\ncreate or replace function public.is_staff() returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.profiles p where p.id = auth.uid() and p.role in ('staff','admin') and not p.is_banned) $$;\n\ncreate or replace function public.set_updated_at() returns trigger language plpgsql as $$\nbegin new.updated_at := now(); return new; end $$;\n\n-- ======================================================================\n-- 3. ข้อมูลหลัก: ประเภททรัพย์ / ทำเล / โครงการ / รถไฟฟ้า / แท็ก\n-- ======================================================================\ncreate table if not exists public.property_types (\n  id serial primary key, name_th text not null unique, name_en text,\n  group_key text not null check (group_key in ('residential','commercial')), icon text, sort_no int not null default 0\n);\ncreate table if not exists public.zones (                      -- ทำเล\n  id serial primary key, name_th text not null unique, name_en text,\n  lat double precision, lng double precision, is_popular boolean not null default false, sort_no int not null default 0,\n  zone_group text not null default 'ทำเลยอดนิยม',          -- กรุงเทพฯ (เขต) / จังหวัด / ย่านยอดนิยม / ทำเลยอดนิยม\n  parent_th text,                                          -- จังหวัดแม่ (เลือกจังหวัด = รวมย่านในจังหวัดนั้น)\n  created_by uuid references public.profiles(id) on delete set null, created_at timestamptz not null default now()\n);\nalter table public.zones add column if not exists zone_group text not null default 'ทำเลยอดนิยม';\nalter table public.zones add column if not exists parent_th text;\ncreate index if not exists zones_group_idx on public.zones (zone_group, sort_no);\ncreate table if not exists public.projects (                   -- โครงการ (ข้อมูลหน้าโครงการดึงจากประกาศ)\n  id serial primary key, name_th text not null, name_en text,\n  zone_id int references public.zones(id) on delete set null,\n  lat double precision, lng double precision,\n  created_by uuid references public.profiles(id) on delete set null, created_at timestamptz not null default now()\n);\ncreate unique index if not exists projects_name_uq on public.projects (lower(name_th));\ncreate index if not exists projects_trgm_th on public.projects using gin (name_th extensions.gin_trgm_ops);\ncreate index if not exists projects_trgm_en on public.projects using gin (name_en extensions.gin_trgm_ops);\ncreate table if not exists public.transit_lines (              -- สายรถไฟฟ้า\n  id serial primary key, name_th text not null unique, name_en text, color text, letter text, logo_url text, sort_no int not null default 0\n);\ncreate table if not exists public.tags (                       -- แฮชแท็ก\n  id serial primary key, group_key text not null check (group_key in ('highlight','amenity','view')),\n  name_th text not null unique, name_en text, name_zh text, icon text\n);\n\n-- ======================================================================\n-- 4. ประกาศ\n-- ======================================================================\ncreate sequence if not exists public.listing_code_seq start 20001;\ncreate table if not exists public.listings (\n  id               bigserial primary key,\n  code             text unique default ('C' || nextval('public.listing_code_seq')),   -- รหัสทรัพย์\n  owner_id         uuid not null references public.profiles(id),\n  poster_role      public.poster_role not null default 'owner',\n  deal             public.deal_type not null,\n  property_type_id int not null references public.property_types(id),\n  project_id       int references public.projects(id) on delete set null,\n  zone_id          int not null references public.zones(id),\n  station          text,                                   -- สถานีรถไฟฟ้าที่ใกล้ที่สุด (ข้อความ)\n\n  title_th text not null, title_en text, title_zh text,\n  desc_th  text not null, desc_en  text, desc_zh  text,\n\n  price        numeric(14,2) not null check (price >= 0),\n  promo_price  numeric(14,2),\n  area_sqm     numeric(10,2) not null,\n  floor_no     text,                                      -- เก็บเป็นข้อความ รองรับ 'N/A'\n  bedrooms     smallint not null default 0,               -- 0 = สตูดิโอ\n  bathrooms    smallint not null default 0,\n  available_from date,\n  lat double precision, lng double precision,\n\n  use_profile_contact boolean not null default true,      -- ใช้เบอร์/LINE จากโปรไฟล์\n  contact_phone text, contact_line text,\n  accept_credit_card boolean not null default false,\n  short_term_rental  boolean not null default false,\n  accept_co_agent    boolean not null default false,\n\n  status        public.listing_status not null default 'draft',\n  reject_reason text,\n  reviewed_by   uuid references public.profiles(id),\n  reviewed_at   timestamptz,\n\n  image_source_id bigint references public.listings(id) on delete set null,   -- ประกาศ \"ขายและเช่า\" ใช้รูปชุดเดียวกัน\n  view_count   int not null default 0,\n\n  closed_at    timestamptz,                               -- ปิดการขาย\n  deleted_at   timestamptz,                               -- ลบแบบซ่อน (เก็บข้อมูลไว้ กู้คืนได้)\n  deleted_by   uuid references public.profiles(id),\n  bumped_at    timestamptz,                               -- ดันประกาศ\n  expires_at   timestamptz not null default (now() + interval '30 days'),\n  created_at   timestamptz not null default now(),\n  updated_at   timestamptz not null default now()\n);\ncreate index if not exists listings_search_idx on public.listings (status, deal, property_type_id, zone_id, price);\ncreate index if not exists listings_owner_idx  on public.listings (owner_id, status);\ncreate index if not exists listings_recent_idx on public.listings (status, (greatest(coalesce(bumped_at, created_at), created_at)) desc);\ncreate index if not exists listings_project_idx on public.listings (project_id);\ncreate index if not exists listings_title_trgm on public.listings using gin (title_th extensions.gin_trgm_ops);\n\ncreate table if not exists public.listing_images (\n  id bigserial primary key, listing_id bigint not null references public.listings(id) on delete cascade,\n  kind public.image_kind not null default 'photo', url text not null, sort_no int not null default 0     -- 0 = รูปปก\n);\ncreate index if not exists listing_images_idx on public.listing_images (listing_id, kind, sort_no);\ncreate table if not exists public.listing_tags (\n  listing_id bigint not null references public.listings(id) on delete cascade,\n  tag_id int not null references public.tags(id), primary key (listing_id, tag_id)\n);\ncreate table if not exists public.listing_transit (            -- ใกล้รถไฟฟ้าสายไหน (เลือกได้หลายสาย)\n  listing_id bigint not null references public.listings(id) on delete cascade,\n  transit_id int not null references public.transit_lines(id), primary key (listing_id, transit_id)\n);\ncreate table if not exists public.listing_views (              -- สถิติเข้าชมรายวัน\n  listing_id bigint not null references public.listings(id) on delete cascade,\n  day date not null, views int not null default 0, primary key (listing_id, day)\n);\ncreate table if not exists public.listing_private (            -- แท็กส่วนตัว + โน๊ตส่วนตัว (เห็นเฉพาะเจ้าของ)\n  listing_id bigint not null references public.listings(id) on delete cascade,\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  tags text[] not null default '{}', note text, updated_at timestamptz not null default now(),\n  primary key (listing_id, user_id)\n);\n\n-- ตรวจสิทธิ์/สถานะประกาศ: คนทั่วไปตั้งอนุมัติเองไม่ได้ (ยกเว้นแอดมินตั้งค่า auto_approve ให้)\ncreate or replace function public.listings_guard() returns trigger language plpgsql security definer set search_path = public as $$\ndeclare p public.profiles; can_auto boolean; changed boolean;\nbegin\n  if auth.uid() is null then return new; end if;          -- SQL Editor / service role: ไม่ตรวจ\n  select * into p from public.profiles where id = auth.uid();\n  can_auto := coalesce(p.auto_approve, false) and p.role in ('staff','admin');\n  if tg_op = 'INSERT' then\n    new.owner_id := auth.uid();\n    if new.status <> 'draft' then new.status := case when can_auto then 'approved' else 'pending' end; end if;\n    new.reject_reason := null; new.reviewed_by := null; new.reviewed_at := null;\n    if new.status = 'approved' then new.reviewed_by := auth.uid(); new.reviewed_at := now(); end if;\n    return new;\n  end if;\n  if public.is_admin() then\n    if new.status is distinct from old.status and new.status in ('approved','rejected') then new.reviewed_by := auth.uid(); new.reviewed_at := now(); end if;\n    return new;\n  end if;\n  new.owner_id := old.owner_id; new.code := old.code; new.reject_reason := old.reject_reason; new.reviewed_by := old.reviewed_by; new.reviewed_at := old.reviewed_at;\n  changed := (to_jsonb(new) - '{status,view_count,bumped_at,closed_at,deleted_at,deleted_by,updated_at}'::text[])\n          is distinct from (to_jsonb(old) - '{status,view_count,bumped_at,closed_at,deleted_at,deleted_by,updated_at}'::text[]);\n  if new.status is distinct from old.status and new.status not in ('draft','pending') and not (new.status = 'approved' and can_auto) then\n    new.status := old.status;                              -- ห้ามอนุมัติ/ปฏิเสธเอง\n  end if;\n  if changed and old.status = 'approved' and new.status = 'approved' and not can_auto then new.status := 'pending'; end if;   -- แก้ไขแล้วต้องรออนุมัติใหม่\n  return new;\nend $$;\ndrop trigger if exists trg_listings_guard on public.listings;\ncreate trigger trg_listings_guard before insert or update on public.listings for each row execute function public.listings_guard();\ndrop trigger if exists trg_listings_updated on public.listings;\ncreate trigger trg_listings_updated before update on public.listings for each row execute function public.set_updated_at();\n\n-- มุมมองสำหรับหน้าเว็บ (เฉพาะประกาศที่แสดงต่อสาธารณะ)\ncreate or replace view public.v_listings_public with (security_invoker = true) as\nselect l.*, pt.name_th as type_name, z.name_th as zone_name, p.name_th as project_name,\n       (select li.url from public.listing_images li where li.listing_id = coalesce(l.image_source_id, l.id) and li.kind = 'photo' order by li.sort_no limit 1) as cover_url\nfrom public.listings l\njoin public.property_types pt on pt.id = l.property_type_id\nleft join public.zones z on z.id = l.zone_id\nleft join public.projects p on p.id = l.project_id\nwhere l.status = 'approved' and l.deleted_at is null and l.closed_at is null and l.expires_at > now();\n\n-- นับยอดเข้าชม (เรียกได้โดยไม่ต้องล็อกอิน): select public.bump_view(123);\ncreate or replace function public.bump_view(p_listing bigint) returns void language plpgsql security definer set search_path = public as $$\nbegin\n  update public.listings set view_count = view_count + 1 where id = p_listing and status = 'approved' and deleted_at is null;\n  if found then\n    insert into public.listing_views (listing_id, day, views) values (p_listing, current_date, 1)\n    on conflict (listing_id, day) do update set views = public.listing_views.views + 1;\n  end if;\nend $$;\n\n-- ข้อมูลติดต่อผู้ลงประกาศ (ใช้โปรไฟล์หรือเบอร์เฉพาะประกาศ) เรียกได้เฉพาะประกาศที่แสดงสาธารณะ\ncreate or replace function public.listing_contact(p_listing bigint)\nreturns table (name text, avatar_url text, poster_role public.poster_role, phone text, line_id text, email text)\nlanguage sql stable security definer set search_path = public as $$\n  select p.name, p.avatar_url, l.poster_role,\n         case when l.use_profile_contact then p.phone else l.contact_phone end,\n         case when l.use_profile_contact then p.line_id else l.contact_line end, p.email\n  from public.listings l join public.profiles p on p.id = l.owner_id\n  where l.id = p_listing and l.status = 'approved' and l.deleted_at is null and l.closed_at is null $$;\n\n-- ======================================================================\n-- 5. การใช้งานของสมาชิก: รายการโปรด / โน๊ต / Inquiry / ข้อความถึงเจ้าหน้าที่\n-- ======================================================================\ncreate table if not exists public.favorites (\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  listing_id bigint not null references public.listings(id) on delete cascade,\n  created_at timestamptz not null default now(), primary key (user_id, listing_id)\n);\ncreate table if not exists public.notes (                      -- My Note\n  id bigserial primary key, user_id uuid not null references public.profiles(id) on delete cascade,\n  listing_id bigint references public.listings(id) on delete set null, body text not null, created_at timestamptz not null default now()\n);\ncreate table if not exists public.inquiries (                  -- Inquiry: ลูกค้าแชทสอบถามประกาศ\n  id bigserial primary key, listing_id bigint not null references public.listings(id) on delete cascade,\n  from_user uuid not null references public.profiles(id), message text, created_at timestamptz not null default now()\n);\ncreate index if not exists inquiries_listing_idx on public.inquiries (listing_id, created_at desc);\ncreate table if not exists public.staff_messages (             -- ข้อความจากลูกค้าถึงเจ้าหน้าที่ + คำตอบกลับ\n  id bigserial primary key, from_user uuid not null references public.profiles(id),\n  kind public.message_kind not null default 'contact', listing_id bigint references public.listings(id) on delete set null,\n  body text not null, read_at timestamptz, reply_body text,\n  replied_by uuid references public.profiles(id), replied_at timestamptz, reply_seen_at timestamptz,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists staff_messages_unread_idx on public.staff_messages (created_at) where read_at is null;\n\n-- ======================================================================\n-- 6. รายงานประกาศ + การแจ้งเตือน\n-- ======================================================================\ncreate table if not exists public.reports (\n  id bigserial primary key,\n  listing_id bigint references public.listings(id) on delete set null,\n  reporter_id uuid not null references public.profiles(id),\n  category public.report_category not null,\n  detail text,\n  status public.report_status not null default 'open',\n  admin_note text, handled_by uuid references public.profiles(id), handled_at timestamptz,\n  created_at timestamptz not null default now()\n);\ncreate unique index if not exists reports_one_open on public.reports (listing_id, reporter_id) where status in ('open','reviewing');   -- รายงานซ้ำขณะยังไม่ปิดเรื่องไม่ได้\ncreate index if not exists reports_status_idx on public.reports (status, created_at desc);\n\ncreate table if not exists public.notifications (\n  id bigserial primary key, user_id uuid not null references public.profiles(id) on delete cascade,\n  type text not null,                      -- report_owner / report_admin / report_result ...\n  body text not null, ref jsonb, read_at timestamptz, created_at timestamptz not null default now()\n);\ncreate index if not exists notifications_user_idx on public.notifications (user_id, read_at, created_at desc);\n\n-- มีรายงานใหม่ → แจ้งเตือนเจ้าของประกาศ (ไม่เปิดเผยผู้แจ้ง) และแอดมินทุกคนอัตโนมัติ\ncreate or replace function public.on_report_created() returns trigger language plpgsql security definer set search_path = public as $$\ndeclare l public.listings; rname text; cat text;\nbegin\n  select * into l from public.listings where id = new.listing_id;\n  if l.id is null then return new; end if;\n  cat := case new.category when 'info' then 'ข้อมูลไม่ตรงกับความเป็นจริง' when 'price' then 'ราคาไม่ตรง' when 'sold' then 'ขายแล้ว/ปล่อยเช่าแล้วแต่ยังประกาศอยู่'\n         when 'dup' then 'ประกาศซ้ำ' when 'photo' then 'รูปภาพไม่ตรง/ไม่เหมาะสม' when 'scam' then 'น่าสงสัย/หลอกลวง' when 'spam' then 'สแปม/โฆษณา' else 'อื่นๆ' end;\n  select name into rname from public.profiles where id = new.reporter_id;\n  insert into public.notifications (user_id, type, body, ref)\n  values (l.owner_id, 'report_owner', 'ประกาศ “' || l.title_th || '” ถูกรายงาน: ' || cat || ' — กรุณาตรวจสอบและแก้ไขข้อมูลให้ถูกต้อง แอดมินกำลังตรวจสอบเรื่องนี้', jsonb_build_object('go','my','listing_id',l.id));\n  insert into public.notifications (user_id, type, body, ref)\n  select p.id, 'report_admin', '🚩 รายงานใหม่: “' || l.title_th || '” — ' || cat || ' (โดย ' || coalesce(rname,'-') || ')', jsonb_build_object('go','reports','report_id',new.id)\n  from public.profiles p where p.role = 'admin' and not p.is_banned;\n  return new;\nend $$;\ndrop trigger if exists trg_report_created on public.reports;\ncreate trigger trg_report_created after insert on public.reports for each row execute function public.on_report_created();\n\n-- ======================================================================\n-- 7. ระบบจัดการหน้าเว็บ (CMS)\n-- ======================================================================\ncreate table if not exists public.site_settings (              -- ชื่อเว็บ สี โลโก้ ติดต่อ แบนเนอร์ พื้นหลัง บล็อกข่าว ฯลฯ (ห้ามเก็บความลับ)\n  key text primary key, value jsonb not null, updated_by uuid references public.profiles(id), updated_at timestamptz not null default now()\n);\ncreate table if not exists public.text_overrides (             -- ข้อความที่เจ้าหน้าที่แก้บนหน้าเว็บ (แยกตามภาษา)\n  lang text not null check (lang in ('th','en','zh')), original text not null, replacement text not null,\n  updated_by uuid references public.profiles(id), updated_at timestamptz not null default now(), primary key (lang, original)\n);\ncreate table if not exists public.news (                       -- ข่าวเด่น / ข่าวรอง / รีวิว / วิดีโอ\n  id serial primary key, kind public.news_kind not null default 'review', title text not null, body text,\n  link_url text, image_url text, sort_no int not null default 0, is_published boolean not null default true,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.featured_agents (            -- เอเจนท์แนะนำ\n  id serial primary key, name text not null, area text, tags text[] not null default '{}', quote text,\n  photo_url text, languages text[] not null default '{th}', phone text, line_id text, email text,\n  sort_no int not null default 0, is_active boolean not null default true\n);\ncreate table if not exists public.audit_log (\n  id bigserial primary key, actor_id uuid references public.profiles(id), action text not null, target text, detail jsonb,\n  created_at timestamptz not null default now()\n);\n\n-- ======================================================================\n-- 8. Row Level Security\n-- ======================================================================\nalter table public.profiles enable row level security;\nalter table public.property_types enable row level security;\nalter table public.zones enable row level security;\nalter table public.projects enable row level security;\nalter table public.transit_lines enable row level security;\nalter table public.tags enable row level security;\nalter table public.listings enable row level security;\nalter table public.listing_images enable row level security;\nalter table public.listing_tags enable row level security;\nalter table public.listing_transit enable row level security;\nalter table public.listing_views enable row level security;\nalter table public.listing_private enable row level security;\nalter table public.favorites enable row level security;\nalter table public.notes enable row level security;\nalter table public.inquiries enable row level security;\nalter table public.staff_messages enable row level security;\nalter table public.reports enable row level security;\nalter table public.notifications enable row level security;\nalter table public.site_settings enable row level security;\nalter table public.text_overrides enable row level security;\nalter table public.news enable row level security;\nalter table public.featured_agents enable row level security;\nalter table public.audit_log enable row level security;\n\ndrop policy if exists \"profiles_self_read\" on public.profiles;\ncreate policy \"profiles_self_read\" on public.profiles for select to authenticated using (id = auth.uid() or public.is_staff());\ndrop policy if exists \"profiles_self_update\" on public.profiles;\ncreate policy \"profiles_self_update\" on public.profiles for update to authenticated using (id = auth.uid() or public.is_admin()) with check (id = auth.uid() or public.is_admin());\ndrop policy if exists \"property_types_public_read\" on public.property_types;\ncreate policy \"property_types_public_read\" on public.property_types for select to anon, authenticated using (true);\ndrop policy if exists \"transit_lines_public_read\" on public.transit_lines;\ncreate policy \"transit_lines_public_read\" on public.transit_lines for select to anon, authenticated using (true);\ndrop policy if exists \"tags_public_read\" on public.tags;\ncreate policy \"tags_public_read\" on public.tags for select to anon, authenticated using (true);\ndrop policy if exists \"zones_public_read\" on public.zones;\ncreate policy \"zones_public_read\" on public.zones for select to anon, authenticated using (true);\ndrop policy if exists \"projects_public_read\" on public.projects;\ncreate policy \"projects_public_read\" on public.projects for select to anon, authenticated using (true);\ndrop policy if exists \"news_public_read\" on public.news;\ncreate policy \"news_public_read\" on public.news for select to anon, authenticated using (is_published or public.is_staff());\ndrop policy if exists \"featured_agents_public_read\" on public.featured_agents;\ncreate policy \"featured_agents_public_read\" on public.featured_agents for select to anon, authenticated using (is_active or public.is_staff());\ndrop policy if exists \"text_overrides_public_read\" on public.text_overrides;\ncreate policy \"text_overrides_public_read\" on public.text_overrides for select to anon, authenticated using (true);\ndrop policy if exists \"site_settings_public_read\" on public.site_settings;\ncreate policy \"site_settings_public_read\" on public.site_settings for select to anon, authenticated using (true);\ndrop policy if exists \"property_types_admin_write\" on public.property_types;\ncreate policy \"property_types_admin_write\" on public.property_types for all to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"transit_lines_admin_write\" on public.transit_lines;\ncreate policy \"transit_lines_admin_write\" on public.transit_lines for all to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"tags_admin_write\" on public.tags;\ncreate policy \"tags_admin_write\" on public.tags for all to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"news_admin_write\" on public.news;\ncreate policy \"news_admin_write\" on public.news for all to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"featured_agents_admin_write\" on public.featured_agents;\ncreate policy \"featured_agents_admin_write\" on public.featured_agents for all to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"site_settings_admin_write\" on public.site_settings;\ncreate policy \"site_settings_admin_write\" on public.site_settings for all to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"zones_staff_insert\" on public.zones;\ncreate policy \"zones_staff_insert\" on public.zones for insert to authenticated with check (public.is_staff());\ndrop policy if exists \"zones_admin_modify\" on public.zones;\ncreate policy \"zones_admin_modify\" on public.zones for update to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"zones_admin_delete\" on public.zones;\ncreate policy \"zones_admin_delete\" on public.zones for delete to authenticated using (public.is_admin());\ndrop policy if exists \"projects_staff_insert\" on public.projects;\ncreate policy \"projects_staff_insert\" on public.projects for insert to authenticated with check (public.is_staff());\ndrop policy if exists \"projects_admin_modify\" on public.projects;\ncreate policy \"projects_admin_modify\" on public.projects for update to authenticated using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists \"projects_admin_delete\" on public.projects;\ncreate policy \"projects_admin_delete\" on public.projects for delete to authenticated using (public.is_admin());\ndrop policy if exists \"text_overrides_staff_write\" on public.text_overrides;\ncreate policy \"text_overrides_staff_write\" on public.text_overrides for all to authenticated using (public.is_staff()) with check (public.is_staff());\ndrop policy if exists \"listings_public_read\" on public.listings;\ncreate policy \"listings_public_read\" on public.listings for select to anon, authenticated using (status = 'approved' and deleted_at is null and closed_at is null and expires_at > now());\ndrop policy if exists \"listings_owner_read\" on public.listings;\ncreate policy \"listings_owner_read\" on public.listings for select to authenticated using (owner_id = auth.uid());\ndrop policy if exists \"listings_staff_read\" on public.listings;\ncreate policy \"listings_staff_read\" on public.listings for select to authenticated using (public.is_staff());\ndrop policy if exists \"listings_staff_insert\" on public.listings;\ncreate policy \"listings_staff_insert\" on public.listings for insert to authenticated with check (owner_id = auth.uid() and public.is_staff());\ndrop policy if exists \"listings_owner_update\" on public.listings;\ncreate policy \"listings_owner_update\" on public.listings for update to authenticated using (owner_id = auth.uid() or public.is_admin()) with check (owner_id = auth.uid() or public.is_admin());\ndrop policy if exists \"listings_admin_delete\" on public.listings;\ncreate policy \"listings_admin_delete\" on public.listings for delete to authenticated using (public.is_admin());\ndrop policy if exists \"listing_images_read\" on public.listing_images;\ncreate policy \"listing_images_read\" on public.listing_images for select to anon, authenticated using (exists (select 1 from public.listings l where l.id = listing_id));\ndrop policy if exists \"listing_images_owner_write\" on public.listing_images;\ncreate policy \"listing_images_owner_write\" on public.listing_images for all to authenticated using (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_admin()))) with check (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_admin())));\ndrop policy if exists \"listing_tags_read\" on public.listing_tags;\ncreate policy \"listing_tags_read\" on public.listing_tags for select to anon, authenticated using (exists (select 1 from public.listings l where l.id = listing_id));\ndrop policy if exists \"listing_tags_owner_write\" on public.listing_tags;\ncreate policy \"listing_tags_owner_write\" on public.listing_tags for all to authenticated using (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_admin()))) with check (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_admin())));\ndrop policy if exists \"listing_transit_read\" on public.listing_transit;\ncreate policy \"listing_transit_read\" on public.listing_transit for select to anon, authenticated using (exists (select 1 from public.listings l where l.id = listing_id));\ndrop policy if exists \"listing_transit_owner_write\" on public.listing_transit;\ncreate policy \"listing_transit_owner_write\" on public.listing_transit for all to authenticated using (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_admin()))) with check (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_admin())));\ndrop policy if exists \"listing_views_owner_read\" on public.listing_views;\ncreate policy \"listing_views_owner_read\" on public.listing_views for select to authenticated using (exists (select 1 from public.listings l where l.id = listing_id and (l.owner_id = auth.uid() or public.is_staff())));\ndrop policy if exists \"listing_private_own\" on public.listing_private;\ncreate policy \"listing_private_own\" on public.listing_private for all to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());\ndrop policy if exists \"favorites_own\" on public.favorites;\ncreate policy \"favorites_own\" on public.favorites for all to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());\ndrop policy if exists \"notes_own\" on public.notes;\ncreate policy \"notes_own\" on public.notes for all to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());\ndrop policy if exists \"inquiries_insert\" on public.inquiries;\ncreate policy \"inquiries_insert\" on public.inquiries for insert to authenticated with check (from_user = auth.uid());\ndrop policy if exists \"inquiries_read\" on public.inquiries;\ncreate policy \"inquiries_read\" on public.inquiries for select to authenticated using (from_user = auth.uid() or public.is_staff() or exists (select 1 from public.listings l where l.id = listing_id and l.owner_id = auth.uid()));\ndrop policy if exists \"staff_messages_insert\" on public.staff_messages;\ncreate policy \"staff_messages_insert\" on public.staff_messages for insert to authenticated with check (from_user = auth.uid());\ndrop policy if exists \"staff_messages_read\" on public.staff_messages;\ncreate policy \"staff_messages_read\" on public.staff_messages for select to authenticated using (from_user = auth.uid() or public.is_staff());\ndrop policy if exists \"staff_messages_staff_update\" on public.staff_messages;\ncreate policy \"staff_messages_staff_update\" on public.staff_messages for update to authenticated using (public.is_staff() or from_user = auth.uid()) with check (public.is_staff() or from_user = auth.uid());\ndrop policy if exists \"reports_insert\" on public.reports;\ncreate policy \"reports_insert\" on public.reports for insert to authenticated with check (reporter_id = auth.uid() and not exists (select 1 from public.listings l where l.id = listing_id and l.owner_id  if(kind==='resolve')return askp('บันทึกผลการดำเนินการ (ผู้ลงประกาศและผู้แจ้งจะเห็นข้อความนี้)',r.note||'',n=>fin('resolved',n.trim(),'ผลตรวจสอบรายงานประกาศ “'+ttl+'”: ดำเนินการแล้ว'+(n.trim()?' — '+n.trim():''),'ขอบคุณที่แจ้งรายงาน “'+ttl+'” แอดมินตรวจสอบและดำเนินการแล้ว'+(n.trim()?' — '+n.trim():'')));
 if(kind==='dismiss')return askp('บันทึกเหตุผลที่ไม่พบปัญหา (ไม่บังคับ)',r.note||'',n=>fin('dismissed',n.trim(),'รายงานประกาศ “'+ttl+'” ถูกปิดเรื่องแล้ว: ตรวจสอบแล้วไม่พบปัญหา','ขอบคุณที่แจ้งรายงาน “'+ttl+'” แอดมินตรวจสอบแล้วไม่พบปัญหาตามที่แจ้ง'+(n.trim()?' — '+n.trim():'')));
 if(kind==='suspend'&&l)return askp('เหตุผลที่ระงับประกาศ (ผู้ลงประกาศจะเห็น)',RPTL[r.cat],n=>{const why=n.trim()||RPTL[r.cat];l.status='rejected';l.rejectReason='ถูกรายงาน: '+why;l.reviewedBy=DB.me;DB.reports.filter(x=>x.l===l.id&&(x.st==='open'||x.st==='reviewing')).forEach(x=>{x.st='resolved';x.note='ระงับประกาศ: '+why;x.by=by;x.hat=Date.now()});notify(l.owner,'report_result','ประกาศ “'+l.title+'” ถูกระงับจากการตรวจสอบรายงาน: '+why+' — แก้ไขข้อมูลแล้วส่งตรวจสอบใหม่ได้');new Set(DB.reports.filter(x=>x.l===l.id).map(x=>x.from)).forEach(f=>notify(f,'report_result','ขอบคุณที่แจ้งรายงาน “'+l.title+'” แอดมินระงับประกาศนี้แล้ว'));save();nav();admin();toast('ระงับประกาศแล้ว')});
 if(kind==='delete'&&l)return askc('ลบประกาศ “'+l.title+'” ตามรายงานนี้?\n(ซ่อนไว้และเก็บข้อมูลไว้ กู้คืนได้)',()=>{l.deleted=true;l.deletedAt=Date.now();l.deletedBy=DB.me;DB.reports.filter(x=>x.l===l.id&&(x.st==='open'||x.st==='reviewing')).forEach(x=>{x.st='resolved';x.note='ลบประกาศ';x.by=by;x.hat=Date.now()});notify(l.owner,'report_result','ประกาศ “'+l.title+'” ถูกลบจากการตรวจสอบรายงาน: '+RPTL[r.cat]);new Set(DB.reports.filter(x=>x.l===l.id).map(x=>x.from)).forEach(f=>notify(f,'report_result','ขอบคุณที่แจ้งรายงาน “'+l.title+'” แอดมินลบประกาศนี้แล้ว'));save();nav();admin();toast('ลบประกาศแล้ว')},{ok:'ลบประกาศ'})}
// ===== เผยแพร่เนื้อหาให้ทุกคนเห็น (ไม่ต้องมีฐานข้อมูล): content.json + img/ =====
let PUBC=null,PUBON=false,LSNAP=null,PUBCHK=null;
const isStaffU=()=>{const u=me();return !!u&&(u.role==='admin'||u.role==='staff')};
const pubSnap=()=>{const c={};Object.keys(CMSMAP).forEach(k=>{c[k]=CMSMAP[k]});return JSON.parse(JSON.stringify({site:DB.site,listings:DB.listings,cms:c}))};
function pubApply(on){if(!PUBC)return;
 if(on&&!PUBON){LSNAP=pubSnap();const p=JSON.parse(JSON.stringify(PUBC)),keep={dbconf:DB.site.dbconf,dbstat:DB.site.dbstat};DB.site=Object.assign({},p.site||{},keep);
  Object.keys(CMSMAP).forEach(k=>{if(p.cms&&Array.isArray(p.cms[k]))CMSMAP[k].splice(0,CMSMAP[k].length,...p.cms[k])});DB.listings=p.listings||[];PUBON=true;applySite()}
 else if(!on&&PUBON){DB.site=LSNAP.site;Object.keys(LSNAP.cms).forEach(k=>CMSMAP[k].splice(0,CMSMAP[k].length,...LSNAP.cms[k]));DB.listings=LSNAP.listings;PUBON=false;LSNAP=null;applySite()}}
const pubSync=()=>pubApply(!isStaffU());
async function pubLoad(){try{const r=await fetch('content.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const j=await r.json();if(!j||!j.site)return null;if(PUBON)pubApply(false);PUBC=j;pubSync();nav();render();return j}catch(e){return null}}
const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const hash53=str=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
function pubBuild(){const imgs=new Map(),walk=v=>{if(typeof v==='string'){const m=/^data:image\/(png|jpe?g|webp|gif|svg\+xml);base64,/i.exec(v);if(!m)return v;const ext=m[1].toLowerCase().replace('jpeg','jpg').replace('svg+xml','svg'),name='img/'+hash53(v)+'.'+ext;if(!imgs.has(name))imgs.set(name,v.slice(m[0].length));return name}if(Array.isArray(v))return v.map(walk);if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=walk(v[k]);return o}return v};
 const live=DB.listings.filter(l=>{ensure(l);return lstat(l)==='online'}).map(l=>{const c=ownerC(l),x=JSON.parse(JSON.stringify(l));x.po={name:c.name,phone:c.phone||'',line:c.line||'',email:c.email||'',avatar:c.avatar,apos:c.apos,apw:c.apw,aph:c.aph};['ptags','pnote','leads','vlog','rejectReason','reviewedBy','deletedBy'].forEach(k=>delete x[k]);return x});
 const site=JSON.parse(JSON.stringify(DB.site));delete site.dbconf;delete site.dbstat;const cms={};Object.keys(CMSMAP).forEach(k=>{cms[k]=JSON.parse(JSON.stringify(CMSMAP[k]))});
 const snap=walk({v:2,generatedAt:Date.now(),by:(me()||{}).name||'',site,cms,listings:live}),json=JSON.stringify(snap),files=[{name:'content.json',data:new TextEncoder().encode(json)}];let bytes=files[0].data.length;
 imgs.forEach((b,name)=>{const d=b64u8(b);bytes+=d.length;files.push({name,data:d})});return {files,json,snap,nImg:imgs.size,nList:live.length,bytes}}
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;const d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
 files.forEach(f=>{const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length,lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(tm),...u16(dt),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
  parts.push(lh,nm,f.data);cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(tm),...u16(dt),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);off+=lh.length+nm.length+sz});
 const cdSize=cd.reduce((a,b)=>a+b.length,0),end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),0,0]);return new Blob([...parts,...cd,end],{type:'application/zip'})}
function pubDownload(){if(admOnly())return;const b=pubBuild(),blob=zipStore(b.files);try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='newvista-publish-'+new Date().toISOString().slice(0,10)+'.zip';document.body.appendChild(a);a.click();a.remove()}catch(e){}
 DB.pubmeta={t:b.snap.generatedAt,nList:b.nList,nImg:b.nImg,kb:Math.round(b.bytes/1024)};save();toast('สร้างไฟล์เผยแพร่แล้ว — ดูขั้นตอนอัปโหลดด้านล่าง');if(view==='admin')admin();return b}
async function pubCheck(){if(admOnly())return;PUBCHK={busy:true};if(view==='admin')admin();try{const r=await fetch('content.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)PUBCHK={ok:false,msg:'ยังไม่พบไฟล์ content.json บนเว็บ (HTTP '+r.status+')'};else{const j=await r.json();PUBCHK={ok:true,t:j.generatedAt,n:(j.listings||[]).length,same:!!(DB.pubmeta&&DB.pubmeta.t===j.generatedAt)}}}catch(e){PUBCHK={ok:false,msg:'ตรวจสอบไม่ได้ (เปิดเว็บจากที่อยู่จริง เช่น GitHub Pages จึงจะตรวจได้)'}}if(view==='admin'&&aTab==='db')admin()}
function pubPanel(){const m=DB.pubmeta,ck=PUBCHK,dirty=DB.lastEdit&&(!m||DB.lastEdit>m.t),fmt=t=>new Date(t).toLocaleString('th-TH');
 return `<div class="panel" style="border-left:6px solid var(--pri)"><b style="font-size:16px">📤 เผยแพร่เนื้อหาให้ทุกคนเห็น</b>
<div class="mut" style="margin:6px 0 10px;font-size:13px">ตอนนี้ข้อมูลที่แอดมินแก้ (เอเจนท์ ข่าว แบนเนอร์ ธีม ประกาศ ฯลฯ) <b>เก็บอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น</b> เพื่อนที่เปิดเว็บจึงยังเห็นข้อมูลเดิม ปุ่มนี้สร้างไฟล์ชุดเดียวให้อัปโหลดขึ้นเว็บ ทุกคนจะเห็นข้อมูลล่าสุดโดยไม่ต้องมีฐานข้อมูล</div>
${dirty?'<div class="warn" style="margin-bottom:10px">มีการแก้ไขที่ยังไม่ได้เผยแพร่ — กดสร้างไฟล์แล้วอัปโหลดตามขั้นตอนด้านล่าง</div>':''}
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" onclick="pubDownload()">📦 สร้างไฟล์เผยแพร่ (ZIP)</button><button class="btn o" style="color:var(--pri)" onclick="pubCheck()" ${ck&&ck.busy?'disabled':''}>🔎 ตรวจว่าเว็บเผยแพร่ถึงไหนแล้ว</button></div>
${m?`<div class="mut" style="font-size:12px;margin-top:8px">สร้างล่าสุด ${fmt(m.t)} · ประกาศที่ออนไลน์ ${m.nList} รายการ · รูป ${m.nImg} ไฟล์ · ขนาดรวม ${m.kb} KB</div>`:''}
${ck&&!ck.busy?`<div style="margin-top:8px;font-size:13px;color:${ck.ok?(ck.same?'var(--ok,#16a34a)':'var(--warn)'):'var(--bad)'}">${ck.ok?(ck.same?'✅ เว็บแสดงชุดข้อมูลล่าสุดแล้ว':'⚠ เว็บมีไฟล์เผยแพร่ แต่เป็นชุดเก่ากว่าที่สร้างล่าสุด ('+fmt(ck.t)+' · '+ck.n+' ประกาศ) — อัปโหลดไฟล์ใหม่ หรือรอ 1–2 นาทีแล้วตรวจอีกครั้ง'):'❌ '+esc(ck.msg)}</div>`:''}
<details style="margin-top:10px" ${m?'':'open'}><summary class="lnk" style="cursor:pointer">วิธีอัปโหลดขึ้น GitHub Pages (4 ขั้นตอน)</summary><div class="tip" style="margin:8px 0">ครั้งแรกครั้งเดียว: อัปโหลดไฟล์ <code>index.html</code> เวอร์ชันนี้ (ไฟล์ <code>property-portal.html</code> ที่ดาวน์โหลดจากแชต เปลี่ยนชื่อเป็น index.html) ทับของเดิมบน GitHub ก่อน เพราะเฉพาะเวอร์ชันนี้เท่านั้นที่รู้จักไฟล์ content.json</div><ol style="line-height:1.7;margin:8px 0 0 18px;font-size:14px"><li>กด <b>สร้างไฟล์เผยแพร่ (ZIP)</b> แล้วแตกไฟล์ จะได้ <code>content.json</code> และโฟลเดอร์ <code>img</code></li><li>เปิด GitHub → repository ของเว็บ → <b>Add file → Upload files</b></li><li>ลาก <code>content.json</code> และโฟลเดอร์ <code>img</code> ไปวาง (ไม่ต้องแตะ <code>index.html</code>) แล้วกด <b>Commit changes</b></li><li>รอประมาณ 1–2 นาที ให้เพื่อนรีเฟรชหน้าเว็บ แล้วกด "ตรวจว่าเว็บเผยแพร่ถึงไหนแล้ว" เพื่อยืนยัน</li></ol>
<div class="mut" style="font-size:12px;margin-top:8px">ข้อควรรู้: อัปโหลดผ่านหน้าเว็บ GitHub ได้ครั้งละไม่เกิน 100 ไฟล์ ถ้ามีรูปมากกว่านั้นให้แบ่งอัปโหลดหลายรอบ · ไฟล์รูปตั้งชื่อตามเนื้อหา จึงอัปโหลดซ้ำทับได้ปลอดภัย · ไม่มีรหัสผ่านสมาชิก ข้อความ หรือรายงานอยู่ในไฟล์นี้ (ส่งเฉพาะข้อมูลที่เป็นสาธารณะ)</div></details>
<div class="tip" style="margin:10px 0 0">⚠ สิ่งที่ยังไม่ข้ามเครื่อง: การสมัครสมาชิก ข้อความ/รายงานจากลูกค้า รายการโปรด และการลงประกาศของเจ้าหน้าที่ ยังเก็บเฉพาะเครื่องของผู้ใช้แต่ละคน เพราะต้องมีฐานข้อมูลกลาง (เชื่อม Supabase ได้ในแท็บนี้ด้านล่าง)</div></div>`}
